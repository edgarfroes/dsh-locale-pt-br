# Attach the npm tarball to a GitHub release when a version tag is pushed
# (v<version>, matching package.json). The release asset URL is what
# dependents install: https://github.com/<owner>/dsh-locale-pt-br/releases/download/v<version>/dsh-locale-pt-br-<version>.tgz
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "v${version}" != "${TAG}" ]]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm test
      # prepack runs `build --verify` and `check`.
      - run: npm pack
      - name: Create the release with the tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          file="dsh-locale-pt-br-${TAG#v}.tgz"
          sha="$(sha512sum "$file" | cut -d' ' -f1)"
          gh release create "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "Install: \`dsh plugin --profile web add https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${file}\`"$'\n\n'"sha512: \`${sha}\`"
